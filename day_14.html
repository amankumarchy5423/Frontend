<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        .navvar {
            background-color: rgb(78, 16, 16);
            border-radius: 4px;
        }

        .navvar li {
            float: left;
            list-style: none;
            padding: 5px 5px;
            margin: 25px 10px;
        }

        .navvar ul {
            overflow: auto;
        }

        .navvar li a {
            text-decoration: none;
            padding: 5px 5px;
            color: rgb(248, 236, 213);

        }

        .search {
            float: right;
            color: aliceblue;
            padding: 26px 83px;
        }

        .navvar input {
            /* margin: auto 800px; */
            border-radius: 4px;
            padding: 8px 35px;
            /* float: right; */

            border: 2px solid black;
        }

        input:hover {
            border: 4px solid yellowgreen;
        }

        input:active {
            border: 4px solid yellow;
        }

        .navvar a:hover {
            color: rgb(200, 238, 205);
        }
    </style>
</head>

<body>
    <header>
        <nav class="navvar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Contact Us</a></li>
                <div class="search">
                    <label for="search">Search</label>
                    <input type="text" name="search" id="search" placeholder="search this website">
                </div>
            </ul>
        </nav>
    </header>
</body>

</html>
