<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variable</title>
    <style>
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            --clr : aqua;
            border: 2px solid black;
            background-color: var(--clr);
            box-shadow: 10px 10px 50px var(--clr);
            height: 200px;
            width: 200px;
            margin: 2px 12px;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
