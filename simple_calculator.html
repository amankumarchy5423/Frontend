<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+US+Trad+Guides&family=Science+Gothic:wght@100..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;

        }

        .Heading {
            text-align: center;
        }

        .container {
            /* border: 2px solid black; */
            /* display: inline-block; */
            display: flex;
            flex-flow: column wrap;
            margin: 60px auto;
            /* background-color: red; */
            overflow: auto;
            align-items: center;
        }

        .row {
            overflow: auto;
            /* border: 2px solid black; */
            padding: 10px 10px;
            font-size: 30px;
            /* justify-content:space-around ; */
        }

        .btn {

            justify-content: space-around;
            padding: 11px 22px;
            border: 2px solid black;
            border-radius: 18px;
            cursor: pointer;
        }

        .row input {
            /* font-size: 10px; */
            margin: 0px -9px;
            padding: 29px 32px;
            border: 2px solid black;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1 class="Heading">Welcome To In This website</h1>
    <div class="container">
        <div class="row">
            <input type="text" class="input">
        </div>
        <div class="row" id="bottom1">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">X</button>

        </div>
        <div class="row" id="bottom2">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">-</button>
        </div>
        <div class="row" id="bottom3">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">+</button>
        </div>

        <div class="row" id="bottom4">
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn">=</button>
            <button class="btn">%</button>
        </div>

    </div>
</body>
<script>
    let string = "";
    let buttons = document.querySelectorAll('.btn');
    Array.from(buttons).forEach((button)=>{
        button.addEventListener('click',(e)=>{
            if(e.target.innerHTML == '='){
                string = eval(string);
            }
            else{
            console.log(e.target);
            string = string+e.target.innerHTML;
        }
        document.querySelector('input').value = string;
        })
    })

</script>

</html>
