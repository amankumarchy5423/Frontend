<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables and List</title>
</head>

<body>
    <ul type='circle'>
        <li><strong>first unorder list</strong> </li>
        <li>secand unorder list </li>
        <li>third unorder list </li>
    </ul>
    <ol type='A'>

        <li><strong>first orderd lis</strong></li>
        <li>secand order list </li>
        <li>third order list </li>

    </ol>

    <table>
        <thead>
            <tr>
                <th>Name </th>
                <th>Roll No</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Aman Kumar</td>
                <td>07</td>
            </tr>
            <tr>
                <td>Aryan Kumar</td>
                <td>18</td>
            </tr>
            <tr>
                <td>Manish Kumar</td>
                <td>12</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
