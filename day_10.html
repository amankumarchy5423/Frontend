<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORDER AND BACKGROUND</title>
    <style>
        .borderDG {
            height: 100px;
            background-color: blueviolet;
            width: 350px;
            border: 15px solid green;
            border-radius: 25px;
        }

        .borderspc {
            height: 100px;
            background-color: blueviolet;
            width: 350px;
            border-top: 8px solid rgb(11, 220, 77);
            border-bottom: 15px solid rgb(11, 220, 77);
            border-left: 25px solid rgb(202, 11, 103);
            border-right: 30px solid rgb(202, 11, 103);
            border-top-left-radius: 4px;
            border-top-right-radius: 30px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 4px;
        }

        #backimg {
            height: 800px;
            width: 550px;
            background-image: url("https://media.istockphoto.com/id/1455906752/photo/minimal-idea-of-yellow-light-bulb-surrounded-with-blue-bulbs-on-pastel-background-3d.jpg?s=1024x1024&w=is&k=20&c=i1ivZ3HrQWEwS-QxPoZFj1C5YhoDDOg6OlfCIFClzTY=");
            border: 15px solid red;
            background-position: 20px center;/*center center or 50px 80px*/
            background-repeat: no-repeat;  /* repea-x,repeat-y,no-repeat*/
        }
    </style>
</head>

<body>
    <h3>BORDER , height , Background with color</h3>
    <p class="borderDG">This is paragraph one</p>
    <p class="borderspc">This is pragraph two</p>
    <p id="backimg">
        Back ground image is inserted
    </p>
</body>

</html>
