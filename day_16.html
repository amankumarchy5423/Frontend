<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <style>
        .container{
            border: 4px solid royalblue;
            background-color: aliceblue;
            height:3333px;
        }
        .box{
            border: 3px solid wheat;
            width: 150px;
            height: 200px;
            margin: 5px;
            padding: 5px;
            display: inline-block;
        }
        #box3{
            position: sticky;
            top: 33px;
            /* bottom: 68px; */
        }
    </style>
</head>
<body><div class="container">

    <div class="box" id="box1"> 1 Lorem ipsum dolor sit.</div>
    <div class="box" id="box2"> 2 Lorem ipsum dolor sit.</div>
    <div class="box" id="box3"> 3 Lorem ipsum dolor sit.</div>
    <div class="box" id="box4"> 4 Lorem ipsum dolor sit.</div>
</div>
</body>
</html>
